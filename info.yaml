# Tiny Tapeout project information
project:
  title:        "CIC2 decimator for a delta-sigma ADC"
  author:       "Alexnader Co Abad"      # TODO: replace
  discord:      ""
  description:  "2nd-order CIC decimator (R=128, 15-bit word) turning a 1-bit delta-sigma bitstream into a 10-bit code at fclk/128"
  language:     "Verilog"
  clock_hz:     1024000       # 1.024 MHz: bitstream clock of the delta-sigma ADC (8 kS/s output)

  tiles: "1x1"

  # TODO: make the name unique by adding your GitHub username, e.g. tt_um_<user>_cic2_decimator (then update test/tb.v too)
  top_module:  "tt_um_cic2_decimator"

  source_files:
    - "project.v"
    - "cic2.v"
    - "cic_adc_out.v"

pinout:
  # Inputs
  ui[0]: "DIN: 1-bit delta-sigma bitstream"
  ui[1]: ""
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "CODE[0]"
  uo[1]: "CODE[1]"
  uo[2]: "CODE[2]"
  uo[3]: "CODE[3]"
  uo[4]: "CODE[4]"
  uo[5]: "CODE[5]"
  uo[6]: "CODE[6]"
  uo[7]: "CODE[7]"

  # Bidirectional pins
  uio[0]: "CODE[8]"
  uio[1]: "CODE[9]"
  uio[2]: "CODE_VALID: one-clock pulse when CODE has just been updated"
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
